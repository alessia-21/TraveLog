<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Itinerari Interattivi</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="viaggio.css">
  <!-- Fogli di stile di Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <!-- icone -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,700;1,500&family=Nunito:wght@400;600;700;800&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
  <style>
    /* etichetta area sulla card (in alto a sinistra) */
    .trip-card .tag { text-transform: none; font-size: 18px; padding: 4px 11px; }
    /* badge "in programma" in alto a destra */
    .trip-card .tag.prog { left: auto; right: 12px; background: var(--lilla); color: #fff; font-size: 16px; }
    /* secondo filtro (area): chip più piccoli */
    .chip-s { font-size: 12.5px; padding: 8px 14px; }
    /* menu in alto: spazio riservato subito, così la pagina non salta quando si carica ui.js */
    body.v2 .v2-main { padding-top: calc(104px + env(safe-area-inset-top)); }
  </style>
</head>

<body class="v2">
  <div class="v2-main">
    <div class="mp-head">
      <h1>Scegli il tuo viaggio</h1>
      <div class="switch" role="tablist">
        <button id="b-mappa" class="on" type="button">Mappa</button>
        <button id="b-elenco" type="button">Elenco</button>
      </div>
    </div>

    <div id="vista-mappa"><div id="map"></div></div>

    <div id="vista-elenco" hidden>
      <div class="filtri">
        <input id="cerca" type="search" placeholder="Cerca un viaggio…" autocomplete="off">
      </div>
      <!-- filtro per tipo di viaggio -->
      <div class="filtri" id="f-tipo">
        <button class="chip on" data-t="tutti" type="button">Tutti</button>
        <button class="chip" data-t="fuga" type="button">✈️ Fughe</button>
        <button class="chip" data-t="avventura" type="button">🌍 Avventure</button>
      </div>
      <!-- filtro per area -->
      <div class="filtri" id="f-area">
        <button class="chip chip-s on" data-a="tutti" type="button">Ovunque</button>
        <button class="chip chip-s" data-a="europa" type="button">🇪🇺 Europa</button>
        <button class="chip chip-s" data-a="asia" type="button">🌸 Asia</button>
      </div>
      <div id="elenco"></div>
    </div>
  </div>

  <!-- Script di Leaflet -->
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script type="module">
    import { loadAllTrips, TIPI, AREE } from "./parser.js";
    import { scenaSvg, dividiNome, notti } from "./ui.js";

    const trips = await loadAllTrips();

    // ---- data di inizio (serve per ordinare e per il badge "In programma") ----
    function inizio(t) {
      const anno = (t.periodo.match(/\d{4}/) || [])[0];
      const g = Object.values(t.giorni).find(x => x.data);
      const oggi = new Date();
      if (g) {
        if (anno) return new Date(+anno, g.data.m - 1, g.data.g);
        let d = new Date(oggi.getFullYear(), g.data.m - 1, g.data.g);   // senza anno: prossima occorrenza
        if (d < oggi) d = new Date(oggi.getFullYear() + 1, g.data.m - 1, g.data.g);
        return d;
      }
      return anno ? new Date(+anno, 0, 1) : oggi;
    }
    const oggi = new Date();
    trips.forEach(t => { t._inizio = inizio(t); t._futuro = t._inizio > oggi; });
    const ordinati = [...trips].sort((a, b) => b._inizio - a._inizio);

    // ---- ELENCO ----
    const elenco = document.getElementById("elenco");
    // ---- ricorda filtri e posizione (per quando torni da un viaggio) ----
    const CH = "itinerariStato";
    let st = {};
    try { st = JSON.parse(sessionStorage.getItem(CH) || "{}"); } catch (e) {}
    const cercaEl = document.getElementById("cerca");
    let filtroTipo = TIPI[st.tipo] ? st.tipo : "tutti", filtroArea = AREE[st.area] ? st.area : "tutti";
    cercaEl.value = st.q || "";
    document.querySelectorAll("#f-tipo .chip").forEach(x => x.classList.toggle("on", x.dataset.t === filtroTipo));
    document.querySelectorAll("#f-area .chip").forEach(x => x.classList.toggle("on", x.dataset.a === filtroArea));
    function salva(torna) {
      try { sessionStorage.setItem(CH, JSON.stringify({ tipo: filtroTipo, area: filtroArea, q: cercaEl.value, scroll: window.scrollY, torna: !!torna, quando: Date.now() })); } catch (e) {}
    }
    function disegnaElenco() {
      const q = document.getElementById("cerca").value.trim().toLowerCase();
      const ok = t =>
        (filtroTipo === "tutti" || t.tipo === filtroTipo) &&
        (filtroArea === "tutti" || t.area === filtroArea) &&
        (!q || (t.nome + " " + t.periodo).toLowerCase().includes(q));
      const card = t => {
        const { titolo, anno, extra } = dividiNome(t.nome);
        const a = AREE[t.area];
        return `<a class="trip-card" href="viaggio.html?trip=${t.id}" style="--acc:${t.colore}">
          ${a ? `<span class="tag">${a.emoji} ${a.nome}</span>` : ""}
          ${t._futuro ? '<span class="tag prog">IN PROGRAMMA</span>' : ""}
          <div class="art">${scenaSvg(t)}</div>
          <div class="info"><h3>${titolo}${anno ? " " + anno : ""}</h3>
          <div class="per">${[t.periodo, notti(t), extra].filter(Boolean).join(" · ")}</div></div></a>`;
      };
      let html = "";
      Object.entries(TIPI).forEach(([chiave, { emoji, nome }]) => {
        const lista = ordinati.filter(t => t.tipo === chiave && ok(t));
        if (lista.length) html += `<div class="sezione">${emoji} ${nome}</div><div class="cards">${lista.map(card).join("")}</div>`;
      });
      elenco.innerHTML = html || '<p class="vuoto">Nessun viaggio trovato.</p>';
    }
    disegnaElenco();
    cercaEl.addEventListener("input", () => { disegnaElenco(); salva(false); });
    elenco.addEventListener("click", e => { if (e.target.closest("a.trip-card")) salva(true); });
    document.querySelectorAll("#f-tipo .chip").forEach(c => c.addEventListener("click", () => {
      document.querySelectorAll("#f-tipo .chip").forEach(x => x.classList.toggle("on", x === c));
      filtroTipo = c.dataset.t; disegnaElenco(); salva(false);
    }));
    document.querySelectorAll("#f-area .chip").forEach(c => c.addEventListener("click", () => {
      document.querySelectorAll("#f-area .chip").forEach(x => x.classList.toggle("on", x === c));
      filtroArea = c.dataset.a; disegnaElenco(); salva(false);
    }));

    // ---- INTERRUTTORE Mappa / Elenco ----
    const vMappa = document.getElementById("vista-mappa"), vElenco = document.getElementById("vista-elenco");
    let map;
    function vai(v) {
      vMappa.hidden = v !== "mappa"; vElenco.hidden = v !== "elenco";
      document.getElementById("b-mappa").classList.toggle("on", v === "mappa");
      document.getElementById("b-elenco").classList.toggle("on", v === "elenco");
      if (v === "mappa" && map) setTimeout(() => map.invalidateSize(), 50);
      try { localStorage.setItem("vistaItinerari", v); } catch (e) {}
    }
    document.getElementById("b-mappa").onclick = () => vai("mappa");
    document.getElementById("b-elenco").onclick = () => vai("elenco");

    // ---- MAPPA ----
    try {
      // il mondo non si ripete ai lati: la mappa si ferma ai bordi, così i segnalini restano sempre visibili
      const MONDO = [[-85, -180], [85, 180]];
      map = L.map('map', { minZoom: 2, maxBounds: MONDO, maxBoundsViscosity: 1 }).setView([20, 0], 2);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap contributors', maxZoom: 19, noWrap: true, bounds: MONDO
      }).addTo(map);

      // un marker per ogni zona: i viaggi vicini tra loro finiscono nello stesso marker
      const gruppi = [];
      trips.forEach(t => {
        let g = gruppi.find(g => Math.abs(g.lat - t.lat) < 0.5 && Math.abs(g.lng - t.lng) < 0.5);
        if (!g) { g = { lat: t.lat, lng: t.lng, trips: [] }; gruppi.push(g); }
        g.trips.push(t);
      });
      gruppi.forEach(g => {
        const colore = g.trips[0].colore;
        const pin = L.divIcon({
          className: 'pin pin-v2',
          html: `<i class="fas fa-location-dot" style="color:${colore}"></i>`,
          iconSize: [34, 34], iconAnchor: [17, 34], popupAnchor: [0, -30]
        });
        const html = g.trips.map(t =>
          `<div class="popup-viaggio"><a href="viaggio.html?trip=${t.id}" class="map-btn" style="background:${t.colore}">` +
          `<i class="fas fa-plane"></i> ${t.nome}</a>` +
          (t.periodo ? `<br><small>${t.periodo}</small>` : "") + `</div>`).join("");
        L.marker([g.lat, g.lng], { icon: pin }).addTo(map).bindPopup(html);
      });
      if (trips.length) map.fitBounds(trips.map(t => [t.lat, t.lng]), { padding: [60, 60], maxZoom: 5 });
    } catch (e) {
      document.getElementById("map").innerHTML = '<p class="vuoto">Mappa non disponibile: usa la vista Elenco.</p>';
    }

    let ultima = "mappa";
    try { ultima = localStorage.getItem("vistaItinerari") || "mappa"; } catch (e) {}
    vai(ultima === "elenco" ? "elenco" : "mappa");

    // se arrivi da un viaggio (indietro o "Tutti gli itinerari"), torni dov'eri nell'elenco
    if (st.torna && st.scroll && Date.now() - (st.quando || 0) < 6e5 && !vElenco.hidden) {
      requestAnimationFrame(() => { window.scrollTo(0, st.scroll); salva(false); });
    }
  </script>
</body>

</html>
